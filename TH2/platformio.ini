[platformio]
default_envs = esp32doit-devkit-v1

[env]
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    duinoWitchery/hd44780@1.3.2

; Main experiment: timestamp-based scheduling.
[env:esp32doit-devkit-v1]
build_src_filter = +<*> -<schedule_delay.cpp>

; Comparison experiment: same tasks, with a long delay between samples.
[env:blocking]
build_src_filter = +<*> -<schedule_millis.cpp>
